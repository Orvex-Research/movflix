<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org https://images.unsplash.com; connect-src 'self'; frame-src https://framextv.cc https://framextv.xyz; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
  <title>Watch Online in 4K Ultra HD – Movflix</title>
  <meta name="description" content="Stream movies, TV shows, and anime online in 4K Ultra HD with high-speed stream extraction.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://idms.eu.cc/watch.html">
  <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE">

  <!-- Open Graph -->
  <meta property="og:title" content="Watch Online in 4K Ultra HD – Movflix">
  <meta property="og:description" content="Stream movies and TV series in 4K Ultra HD.">
  <meta property="og:type" content="video.movie">
  <meta property="og:url" content="https://idms.eu.cc/watch.html">
  <meta property="og:image" content="https://image.tmdb.org/t/p/original/56v2KjBlU4XaOv9rVYEQypROD7P.jpg">
  <meta property="og:site_name" content="Movflix">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json" id="mediaSchema">
  {
    "@context": "https://schema.org",
    "@type": "Movie",
    "name": "Movflix Stream",
    "description": "Stream movies and TV shows in 4K Ultra HD on Movflix"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <script src="js/dev-purge.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════
       CINEMA DUAL-INTERFACE EMBEDDED STYLES (Self-Contained)
       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    svg { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { text-decoration: none; color: inherit; }

    /* Top Header */
    .watch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4%;
      background: rgba(14, 14, 18, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-left-group, .nav-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .watch-brand-logo {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-left: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .nav-icon-circle {
      width: 42px !important;
      height: 42px !important;
      border-radius: 50% !important;
      background: rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      color: #fff !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      text-decoration: none !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .nav-icon-circle:hover {
      background: rgba(255, 255, 255, 0.22) !important;
      border-color: rgba(255, 255, 255, 0.45) !important;
      transform: scale(1.08) !important;
    }
    .nav-icon-circle svg {
      width: 18px !important;
      height: 18px !important;
      display: block !important;
    }

    /* ════ Inline Cinema Video Player ════ */
    .inline-player-section {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #000;
      padding: 0;
    }
    @media (min-width: 769px) {
      .inline-player-section {
        padding: 24px 4% 30px;
        background: radial-gradient(ellipse at top, rgba(229, 9, 20, 0.09) 0%, #0a0a0f 75%);
      }
    }
    .player-media-container {
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #000;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }
    @media (min-width: 769px) {
      .player-media-container {
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
    }
    @media (max-width: 768px) {
      .player-media-container {
        border-radius: 0;
        border: none;
        max-width: 100%;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
    }
    .player-media-container:fullscreen,
    .player-media-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border-radius: 0 !important;
      border: none !important;
      aspect-ratio: auto !important;
    }
    #playerIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    .player-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 5;
    }
    .player-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-size: 0.95rem;
      color: #bbb;
      letter-spacing: 0.02em;
    }
    .player-error-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #000;
      color: #fff;
      z-index: 15;
      text-align: center;
      padding: 24px;
    }
    .player-error-overlay h3 { font-size: 1.5rem; margin: 0; }
    .player-error-overlay p { color: #aaa; max-width: 420px; margin: 0; }
    .btn-retry {
      margin-top: 10px;
      padding: 10px 24px;
      border-radius: 9999px;
      background: #e50914;
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* ════ Watch Details Content (Below Player) ════ */
    .watch-details-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 4% 40px;
    }
    .details-hero-title {
      font-size: clamp(1.7rem, 3.8vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #fff;
      margin: 0 0 12px;
    }
    .details-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.92rem;
      color: #d1d5db;
      margin-bottom: 12px;
    }
    .meta-rating {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      color: #fbbf24;
    }
    .meta-rating svg {
      width: 16px !important;
      height: 16px !important;
      fill: #fbbf24;
    }
    .meta-stat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #9ca3af;
      font-size: 0.88rem;
    }
    .meta-stat svg {
      width: 14px !important;
      height: 14px !important;
    }
    .meta-dot {
      color: #6b7280;
      font-size: 0.8rem;
    }
    .meta-item {
      color: #e5e7eb;
      font-weight: 500;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.76rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
    }
    .meta-pill.gold {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.55);
      color: #fcd34d;
    }
    .details-genres {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 14px;
    }
    .details-overview {
      font-size: 1.02rem;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.86);
      max-width: 850px;
      margin: 16px 0 24px;
    }
    .details-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .btn-glass-hero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-glass-hero:hover {
      background: rgba(255, 255, 255, 0.24);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    .btn-glass-hero.in-list {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.6);
      color: #86efac;
    }
    .btn-glass-hero svg {
      width: 18px !important;
      height: 18px !important;
      stroke: currentColor;
    }

    /* Content sections */
    .content-section {
      padding: 24px 0;
      position: relative;
    }
    .section-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }
    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .season-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #bbb;
    }
    .clean-select {
      background: #18181c;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .clean-select:focus {
      border-color: #e50914;
    }
    .episodes-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 14px;
      scroll-behavior: smooth;
    }
    .episodes-track::-webkit-scrollbar { height: 4px; }
    .episodes-track::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    .ep-card {
      flex: 0 0 230px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s ease;
    }
    .ep-card:hover {
      transform: translateY(-4px);
    }
    .ep-card.active .ep-thumb-wrap {
      border-color: #e50914;
      box-shadow: 0 0 14px rgba(229, 9, 20, 0.45);
    }
    .ep-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #111;
    }
    .ep-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ep-num-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }
    .ep-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      color: #fff;
    }
    .ep-card:hover .ep-play-overlay {
      opacity: 1;
    }
    .ep-info strong {
      font-size: 0.92rem;
      display: block;
      color: #fff;
      margin-bottom: 2px;
    }
    .ep-info p {
      font-size: 0.8rem;
      color: #9ca3af;
      margin: 0;
    }

    /* Cast */
    .cast-track {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      padding-bottom: 16px;
      scroll-behavior: smooth;
    }
    .cast-track::-webkit-scrollbar { height: 4px; }
    .cast-track::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    .cast-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 0 0 110px;
      gap: 8px;
    }
    .cast-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .cast-card:hover .cast-avatar {
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.55);
    }
    .cast-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .cast-character {
      font-size: 0.76rem;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Footer */
    .footer {
      padding: 50px 0 35px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 50px;
    }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }
    .footer-logo { font-size: 1.5rem; font-weight: 900; }
    .logo-r { color: #e50914; }
    .logo-w { color: #fff; }
    .footer-copy { color: #737373; font-size: 0.85rem; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-weight='900' fill='%23E50914'>M</text></svg>">
</head>
<body class="cinema-body">

  <!-- Top Navigation Bar -->
  <header class="watch-header">
    <div class="nav-left-group">
      <button class="nav-icon-circle" id="backBtn" aria-label="Go Back" title="Go Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <a href="index.html" class="nav-icon-circle" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="index.html" class="watch-brand-logo">
        <span class="logo-r">MOV</span><span class="logo-w">FLIX</span>
      </a>
    </div>

    <div class="nav-right-group">
      <button class="nav-icon-circle" id="playerFullscreenBtn" aria-label="Full Screen" title="Toggle Full Screen (Landscape)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- 1. Inline Cinema Video Player -->
  <section class="inline-player-section" id="playerSection">
    <div class="player-media-container" id="playerMediaContainer">
      <iframe
        id="playerIframe"
        src=""
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture; accelerometer; gyroscope"
        allowfullscreen
        referrerpolicy="no-referrer"
        title="Movflix Player"
        loading="eager">
      </iframe>

      <!-- Buffer / Loading State -->
      <div class="player-loader" id="playerLoader">
        <div class="player-spinner"></div>
        <p class="loader-text" id="loaderStatusText">Loading stream...</p>
      </div>

      <!-- Playback Error Fallback -->
      <div class="player-error-overlay" id="playerErrorOverlay" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="56" height="56"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3>Playback Error</h3>
        <p>Could not connect to stream source. Please retry.</p>
        <button class="btn-retry" id="playerRetryBtn">Retry Stream</button>
      </div>
    </div>
  </section>

  <!-- 2. Movie Details Section (Shows right below the player) -->
  <main class="watch-details-content" id="movieDetailsView">
    <div class="details-info-block">
      <!-- Movie Title -->
      <h1 class="details-hero-title" id="detailTitle">Loading Title...</h1>

      <!-- Metadata Badges: Rating, Views, Comments, Year, Duration, 4K, Age -->
      <div class="details-meta-row">
        <span class="meta-rating">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <span id="detailRating">8.5</span>
        </span>
        <span class="meta-stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span id="detailVotes">134</span>
        </span>
        <span class="meta-stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="detailComments">3</span>
        </span>
        <span class="meta-dot">•</span>
        <span class="meta-item" id="detailYear">2026</span>
        <span class="meta-dot">•</span>
        <span class="meta-item" id="detailDuration">2h 25m</span>
        <span class="meta-pill gold">4K</span>
        <span class="meta-pill" id="detailAge">PG-13</span>
      </div>

      <!-- Genres -->
      <div class="details-genres" id="detailGenres">Science Fiction • Action • Adventure</div>

      <!-- Action Buttons -->
      <div class="details-actions">
        <button class="btn-glass-hero" id="detailsListBtn">
          <svg class="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span id="detailsListText">Add to List</span>
        </button>
      </div>

      <!-- Overview -->
      <p class="details-overview" id="detailOverview">Loading movie overview...</p>
    </div>

    <!-- TV Episodes Section (if TV show) -->
    <section class="content-section" id="episodesSection" style="display:none;">
      <div class="section-header-row">
        <h2 class="section-title">Episodes</h2>
        <div class="season-picker">
          <label for="seasonSelect">Season:</label>
          <select id="seasonSelect" class="clean-select"></select>
        </div>
      </div>
      <div class="episodes-track" id="episodesTrack"></div>
    </section>

    <!-- Horizontal Cast Section -->
    <section class="content-section">
      <h2 class="section-title">Cast</h2>
      <div class="cast-track" id="castTrack"></div>
    </section>

    <!-- Recommended / More Like This Section -->
    <section class="content-section">
      <h2 class="section-title">More Like This</h2>
      <div class="mfx-grid" id="recommendationsGrid"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-logo"><span class="logo-r">MOV</span><span class="logo-w">FLIX</span></div>
        <p class="footer-copy">&copy; 2026 Movflix Inc. All rights reserved.</p>
      </div>
    </footer>
  </main>


  <!-- Scripts -->
  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
